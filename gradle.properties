# Memory budget is sized for a 7.6 GB machine, deliberately.
#
# The plan's original values (-Xmx4g plus 1 GB metaspace, unbounded parallel
# workers) were written for a typical dev box and crashed the daemon outright
# on this one:
#   Native memory allocation (mmap) failed to map 689963008 bytes
#   Out of Memory Error (os_windows.cpp:3766)
#
# Halving them then hit the opposite wall -- KSP running Hilt and Room
# annotation processing exhausted a 512 MB metaspace:
#   e: [ksp] java.lang.OutOfMemoryError: Metaspace
#
# Metaspace is native memory, separate from -Xmx, and annotation processors
# are what fill it. These numbers are the settled compromise: enough
# metaspace for KSP, a heap small enough to leave room for it, and a single
# worker because a second concurrent module doubles the metaspace pressure
# on a machine with roughly 1 GB free.
#
# Raise these if the machine gets more RAM. If a build dies with a JVM crash
# dump or a Metaspace error, adjust here before suspecting the code.
org.gradle.jvmargs=-Xmx1792m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=768m

org.gradle.parallel=true
org.gradle.workers.max=1

org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Keep Kotlin compilation inside the Gradle daemon rather than forking yet
# another JVM. Fewer processes matters more than isolation at this RAM size.
kotlin.compiler.execution.strategy=in-process
